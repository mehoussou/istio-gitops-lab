apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-app-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-app
      version: v1
  template:
    metadata:
      labels:
        app: customer-app
        version: v1
    spec:
      containers:
        - name: web
          image: ghcr.io/mehoussou/istio-gitops-lab/customer-app@sha256:1e3408b6c8f89dd1d28a8895bf41c09a7468bac66f783a8608c2fd75f148b33e
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
