name: Build and test customer-app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test
        shell: bash
        run: |
          docker build -t customer-app:test app
          response=$(mktemp)
          trap 'rm -f "$response"; docker rm -f customer-app-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name customer-app-test \
            -p 127.0.0.1:8080:80 customer-app:test

          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/ -o "$response"; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "NGINX did not respond successfully after 15 attempts."
              docker logs customer-app-test
              exit 1
            fi
            sleep 1
          done

          diff -u app/index.html "$response"

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and publish the same image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/customer-app"
          tag="$image:$GITHUB_SHA"

          docker build -t "$tag" app
          response=$(mktemp)
          trap 'rm -f "$response"; docker rm -f customer-app-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name customer-app-test \
            -p 127.0.0.1:8080:80 "$tag"

          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/ -o "$response"; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "NGINX did not respond successfully after 15 attempts."
              docker logs customer-app-test
              exit 1
            fi
            sleep 1
          done

          diff -u app/index.html "$response"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$tag" | tee push.log
          digest=$(awk '/digest: sha256:/ {
            for (i=1; i<NF; i++) if ($i=="digest:") print $(i+1)
          }' push.log)
          test -n "$digest"
          printf 'Deploy this image: `%s@%s`\n' "$image" "$digest" \
            >> "$GITHUB_STEP_SUMMARY"
