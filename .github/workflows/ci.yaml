name: Build and test customer-app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test
        run: |
          docker build -t customer-app:test app
          docker run -d --name customer-app-test \
            -p 127.0.0.1:8080:80 customer-app:test
          trap 'docker rm -f customer-app-test >/dev/null' EXIT
          curl -fsS --retry 10 --retry-connrefused --max-time 5 \
            http://127.0.0.1:8080/ | grep -Fx -f app/index.html

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and publish the same image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/customer-app"
          tag="$image:$GITHUB_SHA"

          docker build -t "$tag" app
          docker run -d --name customer-app-test \
            -p 127.0.0.1:8080:80 "$tag"
          trap 'docker rm -f customer-app-test >/dev/null' EXIT
          curl -fsS --retry 10 --retry-connrefused --max-time 5 \
            http://127.0.0.1:8080/ | grep -Fx -f app/index.html

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$tag" | tee push.log
          digest=$(awk '/digest: sha256:/ {
            for (i=1; i<NF; i++) if ($i=="digest:") print $(i+1)
          }' push.log)
          test -n "$digest"
          printf 'Deploy this image: `%s@%s`\n' "$image" "$digest" \
            >> "$GITHUB_STEP_SUMMARY"
