apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-app-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mehoussou/istio-gitops-lab.git
    targetRevision: main
    path: deploy/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
